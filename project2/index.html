<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Layout</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Navbar -->
    <nav>
        <h1>DecodeLabs</h1>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="content">
            <h2>Responsive Web Design</h2>

            <p>
                This webpage adjusts automatically
                for mobile, tablet, and desktop screens.
            </p>

            <button>Learn More</button>
        </div>
    </section>

    <!-- Cards -->
    <section class="cards">

    <div class="card">
        <i class="fas fa-code"></i>
        <h3>HTML</h3>
        <p>Structure of webpage.</p>
    </div>

    <div class="card">
        <i class="symbol">{ }</i>
        <h3>CSS</h3>
        <p>Styling and layout design.</p>
    </div>

    <div class="card">
        <i class="fas fa-mobile-alt"></i>
        <h3>Responsive</h3>
        <p>Works on all devices.</p>
    </div>

</section>

</body>
</html>
